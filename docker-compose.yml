services:
  qdrant-server:
    image: qdrant/qdrant:latest
    container_name: qdrant-server
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - default   # red interna para microservicios

  rag-api:
    build: .
    container_name: rag-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    #ports:
    #  - "127.0.0.1:8002:8000"
    environment:
      - QDRANT_HOST=qdrant-server
      - QDRANT_PORT=6333
      - COLLECTION_NAME=rag_biologia
      - ADMIN_API_KEY=mi-clave-secreta-para-cargar-datos
    volumes:
      - .:/app                   
      - ./logs:/app/logs
      - ./config.yml:/app/config.yml
    depends_on:
      - qdrant-server
    restart: unless-stopped
    networks:
      - default          # para comunicarse con qdrant
      - observability-net # para enviar trazas a Alloy

networks:
  observability-net:
    external: true   # porque ya la creamos manualmente